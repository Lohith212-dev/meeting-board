<meta charset="utf-8">
<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a meeting app in Vercel Geist, v2. Sticky header + tabs. The Overview is a numbered reading path for someone who missed the call: how much was heard, why the meeting happened, who's who, the idea in one picture, the story in time order with quotes, where it landed, what happens next, your parts, words. Projects show their stage; Decisions and Tasks filter by project, status and owner, with a way back. The Transcript marks key moments and gaps. Review accepts or rejects spelling in bulk and collects reader fixes for the owner to approve. Dotted words explain themselves on hover. */
:root{
  --bg:#ffffff; --bg2:#fafafa; --bg3:#f2f2f2; --fg:#0a0a0a; --fg2:#3d3d3d; --muted:#666666; --border:#eaeaea; --border2:#d4d4d4;
  --accent:#0a0a0a; --accent-fg:#ffffff; --hl:#fff6d6; --hl-line:#f5b400; --avbg:#e6e6e6; --dot-fg:#ffffff;
  --p1:#0068d6; --p1s:#ebf4ff; --p2:#7820bc; --p2s:#f7edfd; --p3:#107d32; --p3s:#e9f6ed;
  --ok:#107d32; --oks:#e9f6ed; --warn:#a35200; --warns:#fff4e3; --crit:#c8001a; --crits:#ffedef;
  --shadow-pop:0 0 0 1px rgba(0,0,0,.08),0 12px 32px -8px rgba(0,0,0,.18); --scrim:rgba(0,0,0,.25);
  --f-sans:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"Geist Mono",ui-monospace,Consolas,monospace;
  --r:6px; --r2:10px; --hh:112px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0a0a0a; --bg2:#111111; --bg3:#1a1a1a; --fg:#ededed; --fg2:#c9c9c9; --muted:#a1a1a1; --border:#262626; --border2:#3a3a3a;
  --accent:#ededed; --accent-fg:#0a0a0a; --hl:#2b2306; --hl-line:#f5b400; --avbg:#2c2c2c; --dot-fg:#0a0a0a;
  --p1:#52a8ff; --p1s:#0b2140; --p2:#c47ef2; --p2s:#28123d; --p3:#5fc47a; --p3s:#0d2816;
  --ok:#5fc47a; --oks:#0d2816; --warn:#f5a524; --warns:#2a1d05; --crit:#ff6b70; --crits:#2d0d10;
  --shadow-pop:0 0 0 1px rgba(255,255,255,.1),0 12px 32px -8px rgba(0,0,0,.7); --scrim:rgba(0,0,0,.55);}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0a0a0a; --bg2:#111111; --bg3:#1a1a1a; --fg:#ededed; --fg2:#c9c9c9; --muted:#a1a1a1; --border:#262626; --border2:#3a3a3a;
  --accent:#ededed; --accent-fg:#0a0a0a; --hl:#2b2306; --hl-line:#f5b400; --avbg:#2c2c2c; --dot-fg:#0a0a0a;
  --p1:#52a8ff; --p1s:#0b2140; --p2:#c47ef2; --p2s:#28123d; --p3:#5fc47a; --p3s:#0d2816;
  --ok:#5fc47a; --oks:#0d2816; --warn:#f5a524; --warns:#2a1d05; --crit:#ff6b70; --crits:#2d0d10;
  --shadow-pop:0 0 0 1px rgba(255,255,255,.1),0 12px 32px -8px rgba(0,0,0,.7); --scrim:rgba(0,0,0,.55);}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:calc(var(--hh) + 12px)}
body{background:var(--bg);color:var(--fg);font-family:var(--f-sans);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
h1{font-size:clamp(30px,5vw,48px);line-height:1.04;letter-spacing:-0.045em}
h2{font-size:22px;letter-spacing:-0.03em;line-height:1.2}
h3{font-size:15px;letter-spacing:-0.01em;line-height:1.35}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
:is(a,button,input,summary):focus-visible{outline:2px solid var(--p1);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-family:var(--f-mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:500}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--border)}
.bar{display:flex;align-items:center;gap:12px;padding-block:12px 6px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 260px}
.logo{width:22px;height:22px;flex:none;border-radius:50%;background:conic-gradient(var(--p1),var(--p2),var(--p3),var(--p1))}
.brand b{font-weight:600;font-size:15px;letter-spacing:-0.01em;white-space:nowrap}
.brand span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:var(--r);border:1px solid var(--border);background:var(--bg);color:var(--fg);font-size:13.5px;font-weight:500;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--bg2);border-color:var(--border2)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{opacity:.88}
.btn svg{width:15px;height:15px;flex:none}
.btn.icon{width:32px;padding:0;justify-content:center}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 12px 11px;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;display:flex;gap:6px;align-items:center}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg)}
.tab .n{font-family:var(--f-mono);font-size:11px;background:var(--bg3);color:var(--muted);border-radius:999px;padding:1px 6px}

main{padding-block:28px 80px}
.panel{display:grid;gap:22px;min-width:0}
.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--r2);padding:20px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.linkbtn{border:0;background:none;padding:0;color:var(--muted);font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--fg)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.sec-intro{display:grid;gap:6px;max-width:720px}
.sec-intro p{color:var(--muted)}

.ts{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:12px;line-height:1;padding:4px 7px;border-radius:var(--r);background:var(--bg3);color:var(--fg);text-decoration:none;white-space:nowrap;font-weight:500;border:1px solid transparent;justify-self:start;align-self:start;cursor:pointer;font-variant-numeric:tabular-nums}
.ts::before{content:"";border-left:6px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent}
.ts:hover{border-color:var(--border2);background:var(--bg)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag.c1{background:var(--p1s);color:var(--p1)} .tag.c2{background:var(--p2s);color:var(--p2)} .tag.c3{background:var(--p3s);color:var(--p3)}
.pill{display:inline-block;font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--oks);color:var(--ok)} .pill.warn{background:var(--warns);color:var(--warn)} .pill.crit{background:var(--crits);color:var(--crit)} .pill.mute{background:var(--bg3);color:var(--muted)}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;flex:none;background:var(--avbg);color:var(--fg2);font-size:11px;font-weight:600;overflow:hidden;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--fg) 8%,transparent)}
.av img{width:100%;height:100%;object-fit:cover;object-position:50% 15%;display:block}
.av.lg{width:40px;height:40px;font-size:13px}
.av.sm{width:22px;height:22px;font-size:9.5px}
.stack{display:inline-flex;align-items:center}
.stack .av{margin-right:-7px;box-shadow:0 0 0 2px var(--bg)}
.owner{display:inline-flex;align-items:center;gap:14px;font-size:13px;min-width:0}

details.meta{border:1px solid var(--border);border-radius:var(--r2);background:var(--bg2)}
details.meta > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;font-size:13.5px}
details.meta > summary::-webkit-details-marker{display:none}
details.meta > summary::before{content:"";width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex:none}
details.meta[open] > summary::before{transform:rotate(45deg)}
details.meta > summary b{font-weight:600}
details.meta > summary .muted{flex:1 1 300px;min-width:0}
.meta-body{display:grid;gap:14px;padding:4px 16px 16px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin:0}
.kv div{background:var(--bg);padding:10px 12px}
.kv dt{font-size:12px;color:var(--muted)} .kv dd{margin:2px 0 0;font-weight:500}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.person{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--border);border-radius:var(--r);background:var(--bg);min-width:0}
.person div{min-width:0}
.person b{display:block;font-weight:500;font-size:13.5px}
.person small{display:block;color:var(--muted);font-size:12px;line-height:1.3}

.hero{display:grid;gap:18px;padding:28px;border:1px solid var(--border);border-radius:var(--r2);background-color:var(--bg);background-image:radial-gradient(color-mix(in srgb,var(--fg) 12%,transparent) 1px,transparent 1px);background-size:20px 20px;background-position:-10px -10px}
.hero .accent{font-size:clamp(16px,2vw,19px);color:var(--fg2);max-width:62ch;margin-top:10px;line-height:1.45}
.outs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.out{background:var(--bg);border:1px solid var(--border);border-radius:var(--r2);padding:14px;display:grid;gap:8px;align-content:start}
.out .row{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.out p{font-size:13.5px;color:var(--fg2)}

.rows{display:grid}
.trow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:11px 0;border-top:1px solid var(--border)}
.rows > .trow:first-child{border-top:0;padding-top:0}
.trow .main{display:grid;gap:6px;min-width:0}
.trow .sub{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.check{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--border2);margin-top:2px}
.wrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--border)}
.rows > .wrow:first-child{border-top:0;padding-top:0}
.wrow b{font-weight:500;font-size:13.5px;display:block}
.wrow small{color:var(--muted);font-size:12px;display:block;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow .mins{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}

.tl{display:grid;gap:6px}
.tl-bar{display:flex;gap:2px;height:30px}
.tl-seg{border:0;border-radius:4px;cursor:pointer;font-family:var(--f-mono);font-size:11.5px;font-weight:600;min-width:0;padding:0}
.tl-seg.c1{background:var(--p1s);color:var(--p1)} .tl-seg.c2{background:var(--p2s);color:var(--p2)} .tl-seg.c3{background:var(--p3s);color:var(--p3)}
.tl-seg:hover{box-shadow:inset 0 0 0 1.5px currentColor}
.tl-ticks{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.chrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--border)}
.num{width:24px;height:24px;border-radius:5px;display:inline-grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:600;flex:none}
.num.c1{background:var(--p1s);color:var(--p1)} .num.c2{background:var(--p2s);color:var(--p2)} .num.c3{background:var(--p3s);color:var(--p3)}
.chrow b{font-weight:500}
.chrow small{display:block;color:var(--muted);font-size:12.5px}
.chrow .acts{display:flex;gap:6px;align-items:center}
.notes{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.notes li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:10px 0;border-top:1px solid var(--border);font-size:13.5px}

.tx{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;align-items:start}
.tx-nav{position:sticky;top:calc(var(--hh) + 16px);display:grid;gap:12px;max-height:calc(100vh - var(--hh) - 32px);overflow:auto}
.search{width:100%;height:34px;border:1px solid var(--border);border-radius:var(--r);background:var(--bg);color:var(--fg);padding:0 10px;font:inherit;font-size:13.5px}
.tx-nav nav{display:grid;gap:2px}
.tx-nav nav button{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start;text-align:left;border:0;background:none;padding:7px 8px;border-radius:var(--r);cursor:pointer;font-size:13px;line-height:1.35;color:var(--fg2)}
.tx-nav nav button:hover{background:var(--bg2);color:var(--fg)}
.tx-nav nav button small{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.tx-acts{display:flex;gap:8px;flex-wrap:wrap}
.tx-acts .btn{flex:1 1 auto;justify-content:center}
.cleanstat{font-size:12.5px;color:var(--muted);border:1px dashed var(--border2);border-radius:var(--r);padding:8px 10px;line-height:1.45}
.chap{display:grid;gap:4px;margin-bottom:36px}
.chap-h{display:grid;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--border);margin-bottom:6px}
.chap-h .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chap-h h2{font-size:20px}
.chap-h ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.chap-h li{font-size:12.5px;color:var(--fg2);background:var(--bg2);border:1px solid var(--border);border-radius:999px;padding:3px 10px}
.u{display:grid;grid-template-columns:62px 28px minmax(0,1fr);gap:10px;padding:10px 8px;border-radius:var(--r);transition:background .2s,opacity .2s}
.u .who{font-weight:600;font-size:13px}
.u p{color:var(--fg2);margin-top:1px}
.u.hl{background:var(--hl);box-shadow:inset 3px 0 0 var(--hl-line)}
.u mark{background:var(--hl);color:inherit;border-radius:2px;box-shadow:0 0 0 1px var(--hl-line)}

.cmap{display:grid;justify-items:center}
.cm-root{background:var(--accent);color:var(--accent-fg);padding:10px 18px;border-radius:var(--r2);text-align:center;font-weight:600;font-size:16px;letter-spacing:-0.01em}
.cm-root small{display:block;font-weight:400;font-size:12.5px;opacity:.75;letter-spacing:0}
.cm-stem{width:1px;height:20px;background:var(--border2)}
.cm-grid{position:relative;width:100%;display:grid;padding-top:20px}
.cm-grid.one::before{display:none}
#projBody{--pc:var(--p1);--pcs:var(--p1s)}
.cm-grid::before{content:"";position:absolute;top:0;height:1px;background:var(--border2);left:var(--rail);right:var(--rail)}
.cm-b{position:relative;display:grid;gap:10px;align-content:start;background:var(--bg);border:1px solid var(--border);border-radius:var(--r2);padding:16px;text-align:left;cursor:pointer}
.cm-b:hover{border-color:var(--border2)}
.cm-b::before{content:"";position:absolute;top:-21px;left:50%;width:1px;height:20px;background:var(--border2)}
.cm-b .t{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cm-b .t h3{font-size:17px;letter-spacing:-0.02em}
.cm-b > p{font-size:13px;color:var(--muted)}
.cm-b ul{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.cm-b li{font-size:13px;padding:6px 9px;border-radius:var(--r);background:var(--bg2);border:1px solid var(--border)}
.cm-b li.open{background:var(--warns);border-color:transparent;color:var(--warn);font-weight:500}
.cm-b .go{font-size:12.5px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.cm-b.c1{border-top:2px solid var(--p1)} .cm-b.c2{border-top:2px solid var(--p2)} .cm-b.c3{border-top:2px solid var(--p3)}
.cm-l{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;font-size:11.5px;color:var(--muted);padding:0 4px}
.cm-l i{width:100%;height:1px;background:var(--muted);position:relative}
.cm-l i::after{content:"";position:absolute;right:-1px;top:-4px;border-left:7px solid var(--muted);border-top:4.5px solid transparent;border-bottom:4.5px solid transparent}
.seg{display:inline-flex;gap:2px;padding:3px;background:var(--bg2);border:1px solid var(--border);border-radius:calc(var(--r) + 3px);flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:var(--r);font-size:13.5px;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--fg);box-shadow:0 0 0 1px var(--border),0 1px 2px rgba(0,0,0,.05)}
.seg button i{width:7px;height:7px;border-radius:50%}
.pintro{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px}
.pintro .what{font-size:16px;line-height:1.55;color:var(--fg2)}
.pfacts{display:grid;gap:10px;font-size:13.5px;align-content:start}
.pfacts > div{display:grid;gap:2px}
.counts3{display:flex;gap:8px;flex-wrap:wrap}
.counts3 button{border:1px solid var(--border);background:var(--bg2);border-radius:var(--r);padding:6px 10px;font-size:13px;cursor:pointer;color:var(--fg2)}
.counts3 button b{font-family:var(--f-mono);color:var(--fg)}

.jstep{display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px}
.jrail{display:flex;flex-direction:column;align-items:center}
.jrail .dot{width:30px;height:30px;border-radius:50%;background:var(--pc);color:var(--dot-fg);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:600;flex:none}
.jrail .line{width:2px;flex:1;background:var(--pcs);margin:4px 0}
.jstep:last-child .jrail .line{display:none}
.jbody{padding-bottom:22px;display:grid;gap:10px;min-width:0}
.jbody .head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:4px}
.jbody .head h3{font-size:17px;letter-spacing:-0.02em}
.jbody .buyer{color:var(--muted);font-size:13.5px}
.jcols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr);gap:8px}
.jcols > div{border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;display:grid;gap:4px;align-content:start;font-size:13.5px}
.jcols .does{background:var(--pcs);border-color:transparent}
.jcols .label{font-size:10.5px}
.sockets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sock{border:1.5px dashed color-mix(in srgb,var(--pc) 50%,transparent);border-radius:var(--r2);padding:14px;display:grid;gap:6px;align-content:start;font-size:13.5px}
.sock svg{width:20px;height:20px;color:var(--pc)}
.sock b{font-weight:600}
.sock span{color:var(--fg2)}
.quote{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px;padding:10px 12px;border-radius:var(--r);background:var(--bg2);border:1px solid var(--border);font-size:13.5px}
.quote q{font-style:italic;color:var(--fg2)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duo > div{border:1px solid var(--border);border-radius:var(--r);padding:12px;display:grid;gap:6px;align-content:start;font-size:13.5px}

.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 26px}
.fstep{position:relative;border:1px solid var(--border);border-radius:var(--r2);padding:14px;display:grid;gap:8px;align-content:start;font-size:13.5px;background:var(--bg)}
.fstep:not(:nth-child(3n)):not(:last-child)::after{content:"";position:absolute;right:-18px;top:22px;border-left:8px solid var(--pc);border-top:5px solid transparent;border-bottom:5px solid transparent}
.fstep .h{display:flex;align-items:center;gap:8px;justify-content:space-between}
.fstep b{font-weight:600;font-size:15px;letter-spacing:-0.01em}
.fstep .k{font-family:var(--f-mono);font-size:11.5px;color:var(--pc);font-weight:600}
.fstep .lbl{font-size:12px;color:var(--muted);display:block}
.fstep .tools{display:flex;flex-wrap:wrap;gap:4px}
.fstep .tools span{font-size:11.5px;padding:1px 7px;border-radius:999px;border:1px solid var(--border);color:var(--muted)}
.fstep.human{background:var(--pcs);border-color:transparent}
.meter{display:flex;align-items:center;gap:10px;flex:1 1 260px;font-size:13.5px}
.meter .m{flex:1;height:8px;border-radius:999px;background:var(--bg3);overflow:hidden}
.meter .m span{display:block;height:100%;background:var(--pc)}
.funcs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px}
.funcs span{padding:2px 9px;border-radius:999px;background:var(--pcs);color:var(--pc);font-weight:500}
.funcs span.later{background:var(--bg3);color:var(--muted)}
.funcs span.label{background:none;padding:0;color:var(--muted)}
.conflict{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.goal{grid-column:1/-1;justify-self:center;text-align:center;background:var(--accent);color:var(--accent-fg);border-radius:var(--r2);padding:10px 18px}
.goal small{display:block;opacity:.7;font-size:11.5px}
.goal b{font-weight:600;font-size:16px}
.side{display:grid;gap:8px;align-content:start}
.side .h{display:flex;align-items:center;gap:8px;font-weight:600}
.box{border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;font-size:13.5px;display:grid;gap:6px}
.box.pos{border-color:var(--pc)}
.way{grid-column:1/-1;background:var(--oks);border-radius:var(--r2);padding:12px 14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;font-size:14px}
.way b{color:var(--ok)}
.weeks{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.week{border:1px solid var(--border);border-radius:var(--r2);display:grid;align-content:start;overflow:hidden}
.week .wh{padding:14px;border-bottom:1px solid var(--border);display:grid;gap:4px;background:var(--pcs)}
.week .wh .label{color:var(--pc)}
.week .wh b{font-size:17px;font-weight:600;letter-spacing:-0.02em}
.week .wb{padding:14px;display:grid;gap:12px;font-size:13.5px}
.week .who{display:grid;gap:8px}
.week .who div{display:flex;align-items:center;gap:8px}
.gate{font-size:12.5px;color:var(--fg2);background:var(--bg2);border:1px dashed var(--border2);border-radius:var(--r);padding:8px 10px}
.icp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.icp .card{padding:14px;display:grid;gap:8px;align-content:start}
.icp ul{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:13.5px}
.icp li::before{content:"·";margin-right:6px;color:var(--pc);font-weight:700}
.icp b{font-size:16px;font-weight:600;letter-spacing:-0.02em}

.drow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;padding:14px 0;border-top:1px solid var(--border);align-items:start}
.rows > .drow:first-child{border-top:0;padding-top:0}
.drow .d{width:8px;height:8px;border-radius:50%;margin-top:7px}
.d.c1{background:var(--p1)} .d.c2{background:var(--p2)} .d.c3{background:var(--p3)}
.drow b{font-weight:600;display:block}
.drow p{color:var(--muted);font-size:13.5px;margin-top:2px}
.openq{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.oq{border:1px solid var(--border);border-radius:var(--r2);padding:16px;display:grid;gap:12px;align-content:start}
.oq .top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;position:static;border:0;background:none}
.oq h3{font-size:16px;letter-spacing:-0.02em}
.oq dl{margin:0;display:grid;gap:8px;font-size:13.5px}
.oq dt{font-size:12px;color:var(--muted)}
.oq dd{margin:1px 0 0;color:var(--fg2)}
.oq .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--border)}
.need{font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;border:1px solid var(--border2)}

.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fbtn{border:1px solid var(--border);background:var(--bg);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;color:var(--fg2)}
.fbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.tbl{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r2)}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:820px}
th{text-align:left;font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:500;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--border);background:var(--bg2);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:top}
tr:last-child td{border-bottom:0}
td.id{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
td.heard{font-family:var(--f-mono);font-size:12.5px;color:var(--crit);text-decoration:line-through;white-space:nowrap}
td.fix{font-weight:600;white-space:nowrap}
td q{color:var(--muted)}
td q mark{background:var(--crits);color:var(--crit);border-radius:2px;padding:0 2px}
.acc{border:1px solid var(--border);background:var(--bg);border-radius:var(--r);padding:3px 10px;font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap}
.acc[aria-pressed="true"]{background:var(--oks);color:var(--ok);border-color:transparent}

.watch{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.wc{display:grid;gap:12px;align-content:start}
.wc .wt{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wc .wt > div{display:flex;align-items:center;gap:10px;min-width:0}
.wc .wt b{display:block;font-weight:600}
.wc .wt small{display:block;color:var(--muted);font-size:12px;line-height:1.3}
.wc .big{font-size:24px;font-weight:600;letter-spacing:-0.04em;white-space:nowrap}
.wc .big small{font-size:12px;color:var(--muted);font-weight:400;letter-spacing:0}
.mini{position:relative;height:6px;border-radius:999px;background:var(--bg3)}
.mini span{position:absolute;top:0;bottom:0;background:var(--fg);border-radius:999px;min-width:4px}
.parts{display:grid;gap:6px}
.part{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13.5px}
.read{border:1px solid var(--border);background:var(--bg);border-radius:var(--r);padding:2px 8px;font-size:12px;cursor:pointer;color:var(--muted)}
.read:hover{color:var(--fg);border-color:var(--border2)}

.qwrap{display:grid;gap:14px;max-width:820px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.qprog{display:flex;align-items:center;gap:10px;flex:1 1 240px;font-size:13px;color:var(--muted)}
.qprog .m{flex:1;height:6px;border-radius:999px;background:var(--bg3);overflow:hidden}
.qprog .m span{display:block;height:100%;background:var(--fg);transition:width .3s}
.qcard{border:1px solid var(--border);border-radius:var(--r2);padding:18px;display:grid;gap:12px}
.qcard.ok{border-color:color-mix(in srgb,var(--ok) 45%,var(--border))}
.qcard.no{border-color:color-mix(in srgb,var(--crit) 45%,var(--border))}
.qcard h3{font-size:16px;letter-spacing:-0.02em;display:flex;gap:10px;align-items:baseline}
.qcard h3 .mono{color:var(--muted);font-size:12px;font-weight:500}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--border);background:var(--bg);border-radius:var(--r);padding:10px 12px;cursor:pointer;font-size:14px;line-height:1.4}
.opt:hover:not(:disabled){border-color:var(--border2);background:var(--bg2)}
.opt i{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border2);flex:none;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:700;color:var(--muted)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--oks)} .opt.right i{border-color:var(--ok);background:var(--ok);color:var(--bg)}
.opt.wrong{border-color:var(--crit);background:var(--crits)} .opt.wrong i{border-color:var(--crit);background:var(--crit);color:var(--bg)}
.opt.dim{opacity:.55}
.fb{border-radius:var(--r);padding:12px 14px;display:grid;gap:8px;font-size:13.5px}
.fb.ok{background:var(--oks)} .fb.no{background:var(--crits)}
.fb b{font-weight:600}
.fb.ok b{color:var(--ok)} .fb.no b{color:var(--crit)}
.fb .acts{display:flex;gap:6px;flex-wrap:wrap}
.qres{border:1px solid var(--border);border-radius:var(--r2);padding:20px;display:grid;gap:12px}
.qres .score{font-size:44px;font-weight:600;letter-spacing:-0.05em;line-height:1}
.qres .score small{font-size:16px;color:var(--muted);letter-spacing:0;font-weight:400}
.qres ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.qres li{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;font-size:13.5px;padding:8px 10px;border:1px solid var(--border);border-radius:var(--r)}
.qsave{font-size:12.5px;color:var(--muted)}
.callout{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid var(--border);border-radius:var(--r2);padding:14px 18px;background:var(--bg2)}
.callout b{font-weight:600}
.done-ic{color:var(--ok);font-weight:600}

.pop{position:fixed;z-index:55;width:min(360px,calc(100vw - 24px));background:var(--bg);border-radius:var(--r2);box-shadow:var(--shadow-pop);padding:12px 14px;display:grid;gap:8px}
.pop[hidden]{display:none}
.pop .ph{display:flex;align-items:center;gap:8px;font-size:13px}
.pop .ph b{font-weight:600}
.pop .ph .mono{color:var(--muted);font-size:12px}
.pop p{font-size:13.5px;color:var(--fg2);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.pop .pa{display:flex;gap:6px;justify-content:space-between;align-items:center}
.pop .btn{height:28px;font-size:12.5px}
.scrim{position:fixed;inset:0;z-index:44;background:var(--scrim)}
.drawer{position:fixed;z-index:45;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--bg);border-left:1px solid var(--border);box-shadow:var(--shadow-pop);display:grid;grid-template-rows:auto 1fr auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer[hidden]{display:none}
.drawer .dh{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:start;gap:10px}
.drawer .dh small{display:block;color:var(--muted);font-size:12.5px}
.drawer .db{overflow:auto;padding:8px}
.drawer .db .u:not(.hl){opacity:.45}
.drawer .db .u:not(.hl):hover{opacity:1}
.drawer .df{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:var(--r);font-size:13.5px;max-width:calc(100% - 32px)}

@media (max-width:980px){
  .outs,.watch,.icp,.flow{grid-template-columns:1fr 1fr}
  .fstep::after{display:none}
  .tx{grid-template-columns:minmax(0,1fr)}
  .tx-nav{position:static;max-height:none}
  .tx-nav nav{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
}
@media (max-width:820px){
  .grid2,.pintro,.weeks,.conflict,.duo,.sockets,.jcols{grid-template-columns:minmax(0,1fr)}
  .cm-grid{grid-template-columns:minmax(0,1fr)!important;padding-top:0}
  .cm-grid::before,.cm-b::before{display:none}
  .cm-l{flex-direction:row;padding:10px 0}
  .cm-l i{width:1px;height:20px}
  .cm-l i::after{right:auto;left:-4px;top:auto;bottom:-2px;border-left:4.5px solid transparent;border-right:4.5px solid transparent;border-top:7px solid var(--muted);border-bottom:0}
  .notes{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .outs,.watch,.icp,.flow{grid-template-columns:minmax(0,1fr)}
  .hero{padding:18px}
  .brand span{display:none}
  .btn .t{display:none}
  .chrow{grid-template-columns:auto minmax(0,1fr)}
  .chrow .acts,.chrow > .mono{grid-column:2}
  .wrow{grid-template-columns:auto minmax(0,1fr) auto}
  .wrow .mins{display:none}
  .u{grid-template-columns:28px minmax(0,1fr)}
  .u .ts{grid-column:2;grid-row:1}
  .u .av{grid-row:1 / span 2}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- v2: the reading path ---------- */
main{padding-block:28px 90px}
#p-overview{gap:44px}
.backbar{position:sticky;top:calc(var(--hh) + env(safe-area-inset-top,0px) + 8px);z-index:15;justify-self:start;display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--border2);background:var(--bg);box-shadow:var(--shadow-pop);font-size:13.5px;font-weight:500;cursor:pointer;margin-bottom:14px}
.backbar:hover{background:var(--bg2)}
section.s{display:grid;gap:16px;min-width:0}
.sh{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sh h2{font-size:24px}
.step{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;background:var(--accent);color:var(--accent-fg);font-family:var(--f-mono);font-size:12.5px;font-weight:600;flex:none}
.sh .mins{margin-left:auto;font-size:13px;color:var(--muted)}
.sh .sub2{flex-basis:100%;padding-left:40px;color:var(--muted);font-size:14px;margin-top:-6px}
.k{font-size:12.5px;color:var(--muted);font-weight:500}
.lede{font-size:clamp(16px,1.9vw,19px);color:var(--fg2);max-width:64ch;margin-top:12px;line-height:1.45}
.ts.nt{color:var(--warn);background:var(--warns)}
.ts.nt::before{display:none}

/* hover terms */
.term{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:help;text-decoration:underline dotted var(--muted);text-decoration-thickness:1.5px;text-underline-offset:3px}
.term:hover,.term:focus-visible{text-decoration-color:var(--fg)}
.tip{position:fixed;z-index:56;width:min(330px,calc(100vw - 24px));background:var(--bg);border-radius:var(--r2);box-shadow:var(--shadow-pop);padding:12px 14px;display:grid;gap:6px;font-size:13.5px}
.tip[hidden]{display:none}
.tip b{font-weight:600}
.tip .src{font-size:12px;color:var(--muted)}
.tip textarea{width:100%;min-height:76px;border:1px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--fg);font:inherit;font-size:13.5px;padding:8px;resize:vertical}
.tip .acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.tip .btn{height:28px;font-size:12.5px}

/* fix this + approved corrections */
.fixable{position:relative}
.fix{position:absolute;top:10px;right:10px;opacity:0;border:1px solid var(--border);background:var(--bg);border-radius:var(--r);font-size:12px;padding:3px 8px;color:var(--muted);cursor:pointer;transition:opacity .15s;display:inline-flex;gap:5px;align-items:center;z-index:2}
.fix svg{width:12px;height:12px}
.fix:hover{color:var(--fg);border-color:var(--border2)}
.fixable:hover > .fix,.fix:focus-visible{opacity:1}
@media (hover:none){.fix{opacity:.85}}
.corr{display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--fg);background:var(--p1s);border-radius:var(--r);padding:7px 10px;margin-top:8px;grid-column:1/-1}
.corr b{color:var(--p1);font-weight:600;white-space:nowrap}
.decided .corr{color:var(--fg)}
.flash{animation:flash 1.8s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--hl-line)}100%{box-shadow:0 0 0 0 transparent}}

/* hero coverage */
.heard{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:13.5px;color:var(--fg2);background:var(--bg);border:1px solid var(--border);border-radius:var(--r2);padding:12px 16px}
.heard .meter{display:flex;height:8px;width:180px;border-radius:999px;overflow:hidden;gap:2px;flex:none}
.heard .meter span{display:block;height:100%}
.heard .good{background:var(--ok)}
.weak{background:repeating-linear-gradient(45deg,var(--warn) 0 3px,transparent 3px 6px);box-shadow:inset 0 0 0 1px var(--warn);border-radius:2px}
.heard b{font-weight:600;color:var(--fg)}
.heard .sp{flex:1 1 300px;min-width:0}

/* why */
.ctx3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ctx3 > div{border:1px solid var(--border);border-radius:var(--r2);padding:16px 18px;display:grid;gap:6px;align-content:start;background:var(--bg)}
.ctx3 h3{font-size:14px;color:var(--muted);font-weight:600}
.ctx3 p{font-size:15px}
.decided{background:var(--accent);color:var(--accent-fg);border-radius:var(--r2);padding:22px 24px;display:grid;gap:8px}
.decided h3{font-size:14px;font-weight:600;opacity:.7}
.decided p{font-size:clamp(18px,2.2vw,22px);font-weight:600;letter-spacing:-0.02em;line-height:1.35;max-width:60ch}
.decided .term{text-decoration-color:currentColor}

/* who */
.ppl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:24px}
.grp{display:grid;gap:12px;align-content:start}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.prow b{display:block;font-weight:600;font-size:14px}
.prow small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35}
.mlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px}
.av.xl{width:44px;height:44px;font-size:14px}
.av.guess{box-shadow:0 0 0 1.5px var(--bg),0 0 0 3px var(--warn)!important}

/* the picture */
.unsure{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--warns);border-radius:var(--r);padding:10px 14px;font-size:13.5px;color:var(--fg2);margin-bottom:18px}
.unsure b{color:var(--warn);font-weight:600}
.diagram{display:grid;justify-items:center}
.plugs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.plug{border:1.5px dashed color-mix(in srgb,var(--p3) 60%,transparent);color:var(--p3);background:var(--p3s);border-radius:999px;padding:5px 13px;font-size:13px;font-weight:500}
.stem{width:1px;height:22px;background:var(--border2);position:relative}
.stem small{position:absolute;left:10px;top:3px;white-space:nowrap;font-size:11.5px;color:var(--muted)}
.hub{text-align:center;background:var(--accent);color:var(--accent-fg);border-radius:var(--r2);padding:12px 22px;display:grid;gap:2px}
.hub b{font-size:17px;font-weight:600;letter-spacing:-0.02em}
.hub small{opacity:.75;font-size:12.5px}
.users{position:relative;width:100%;display:grid;gap:12px;padding-top:22px}
.users::before{content:"";position:absolute;top:0;height:1px;background:var(--border2);left:var(--rail);right:var(--rail)}

  <div class="fbar"><div class="frow" role="group" aria-label="Project"><span class="k">Project</span>${[['all','All'],...D.projects.map(p=>[p.id,p.name])].map(([k,l])=>`<button class="fbtn" type="button" data-df="proj" data-v="${esc(k)}" aria-pressed="${DF.proj===k}">${esc(l)}<span class="c">${cntP(k)}</span></button>`).join('')}</div>

    <nav>${CH.map(c=>`<button type="button" data-jumpch="${c.n}"><span class="num ${pc(c.project)}">${c.n}</span><span>${esc(c.title)}<small>${weakAt(c.start)?'no time':fmt(c.start)}</small></span></button>`).join('')}</nav>

</div>`;
$$('[data-jumpch]').forEach(b=>b.addEventListener('click',()=>document.getElementById('ch-'+b.dataset.jumpch).scrollIntoView({block:'start'})));

function txMd(){
  const L=[`# ${M.title} - transcript`,'',`**Date:** ${M.date}${M.start?', '+M.start:''} · **Duration:** ${durL} · **Where:** ${M.platform||'Teams'}${M.place?', '+M.place:''}`,'',`**People:** ${D.people.filter(p=>!p.notime).map(p=>p.name+(p.title?` (${p.title})`:'')+(p.attended?'':', mentioned')).join('; ')}`];
  if(M.agenda)L.push('',`**Agenda:** ${M.agenda}`);

function openPop(a){
  if(!U.length||a.dataset.t==null)return;
  const t=+a.dataset.t,e=a.dataset.e?+a.dataset.e:null,u=U[idxAt(t)];popFor=a;
  pop.innerHTML=`<div class="ph">${av(u.sp,'sm')}<b>${esc(first(u.sp))}</b><span class="mono">${u.nt?'no time':fmt(u.s)}${e!=null&&!weakAt(t)?' · part runs to '+fmt(e):''}</span></div><p>${esc(u.text)}</p><div class="pa"><button class="btn" type="button" id="popRead">Read full part</button>${M.recording&&!weakAt(t)?`<a class="btn primary" href="${at(t)}" target="_blank" rel="noopener">${PLAY}Play ${fmt(t)}</a>`:""}</div>`;
  pop.hidden=false;const r=a.getBoundingClientRect(),pw=pop.offsetWidth,ph=pop.offsetHeight;
  let x=Math.min(Math.max(12,r.left),innerWidth-pw-12),y=r.bottom+8;if(y+ph>innerHeight-12)y=Math.max(12,r.top-ph-8);
  pop.style.left=x+'px';pop.style.top=y+'px';
  $('#popRead').addEventListener('click',()=>{closePop();openDrawer(t,e)});
}
function closePop(){pop.hidden=true;popFor=null}
const fine=matchMedia('(hover:hover) and (pointer:fine)');
document.addEventListener('mouseover',e=>{if(!fine.matches)return;const a=e.target.closest('.ts');if(a&&!a.closest('#pop')){clearTimeout(hideT);if(popFor!==a){clearTimeout(showT);showT=setTimeout(()=>openPop(a),260)}}else if(e.target.closest('#pop'))clearTimeout(hideT)});
document.addEventListener('mouseout',e=>{if(!fine.matches)return;if(e.target.closest('.ts')||e.target.closest('#pop')){clearTimeout(showT);hideT=setTimeout(closePop,240)}});
document.addEventListener('click',e=>{const a=e.target.closest('.ts');if(e.target.closest('#pop'))return;if(a&&!fine.matches){e.preventDefault();if(popFor===a)closePop();else openPop(a)}else if(!a)closePop()},true);
document.addEventListener('focusin',e=>{const a=e.target.closest('.ts');if(a&&fine.matches&&!a.closest('#pop'))openPop(a)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePop();closeDrawer()}});
addEventListener('scroll',()=>{if(!pop.hidden)closePop()},{passive:true});

const dr=$('#drawer'),scrim=$('#scrim');
function openDrawer(t,e){
  closePop();if(!U.length)return;
  const ids=partIdx(t,e),c=chOf(U[ids[0]].s);
  const lo=Math.max(0,ids[0]-2),hi=Math.min(U.length-1,ids[ids.length-1]+2);
  let rows='';for(let i=lo;i<=hi;i++)rows+=uRow(U[i],i,ids.includes(i)?' hl':'',false);
  dr.innerHTML=`<div class="dh"><div><b>${weakAt(t)?'Part without exact times':e!=null?'Part '+fmt(t)+' – '+fmt(e):'At '+fmt(t)}</b><small>Chapter ${c.n} · ${esc(c.title)} · only the highlighted lines belong to this part</small></div><button class="btn icon" type="button" id="drClose" aria-label="Close">✕</button></div>
  <div class="db">${rows}</div>
  <div class="df">${M.recording&&!weakAt(t)?`<a class="btn primary" href="${at(t)}" target="_blank" rel="noopener">${PLAY}Play from ${fmt(t)}</a>`:"<span></span>"}<button class="btn" type="button" id="drFull">Open in transcript</button></div>`;
  dr.hidden=false;scrim.hidden=false;
  const h=dr.querySelector('.u.hl');if(h)h.scrollIntoView({block:'center'});
  $('#drClose').addEventListener('click',closeDrawer);$('#drClose').focus();
  $('#drFull').addEventListener('click',()=>{closeDrawer();jump('transcript',null,()=>{$$('#txbody .u.hl').forEach(x=>x.classList.remove('hl'));ids.forEach(i=>{const el=document.getElementById('u-'+i);if(el)el.classList.add('hl')});const el=document.getElementById('u-'+ids[0]);if(el)el.scrollIntoView({block:'center'})})});
}
function closeDrawer(){dr.hidden=true;scrim.hidden=true}
scrim.addEventListener('click',closeDrawer);

if(NP)setProj(curProj);
show(location.hash.slice(1)||'overview',true);
})();
</script>
