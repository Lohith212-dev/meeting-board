<meta charset="utf-8">
<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a meeting app in Vercel Geist. Sticky header (title, recording, Excel) + sticky tabs. Overview lands first; Transcript, Projects, Decisions, Tasks, Watch list, Review hold the detail. The Transcript tab copies or downloads the whole clean transcript as Markdown. Timestamps preview their transcript on hover; "Read full part" opens a side panel with only that part highlighted. */
:root{
  --bg:#ffffff; --bg2:#fafafa; --bg3:#f2f2f2; --fg:#0a0a0a; --fg2:#3d3d3d; --muted:#666666; --border:#eaeaea; --border2:#d4d4d4;
  --accent:#0a0a0a; --accent-fg:#ffffff; --hl:#fff6d6; --hl-line:#f5b400; --avbg:#e6e6e6; --dot-fg:#ffffff;
  --p1:#0068d6; --p1s:#ebf4ff; --p2:#7820bc; --p2s:#f7edfd; --p3:#107d32; --p3s:#e9f6ed;
  --ok:#107d32; --oks:#e9f6ed; --warn:#a35200; --warns:#fff4e3; --crit:#c8001a; --crits:#ffedef;
  --shadow-pop:0 0 0 1px rgba(0,0,0,.08),0 12px 32px -8px rgba(0,0,0,.18); --scrim:rgba(0,0,0,.25);
  --f-sans:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"Geist Mono",ui-monospace,Consolas,monospace;
  --r:6px; --r2:10px; --hh:112px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0a0a0a; --bg2:#111111; --bg3:#1a1a1a; --fg:#ededed; --fg2:#c9c9c9; --muted:#a1a1a1; --border:#262626; --border2:#3a3a3a;
  --accent:#ededed; --accent-fg:#0a0a0a; --hl:#2b2306; --hl-line:#f5b400; --avbg:#2c2c2c; --dot-fg:#0a0a0a;
  --p1:#52a8ff; --p1s:#0b2140; --p2:#c47ef2; --p2s:#28123d; --p3:#5fc47a; --p3s:#0d2816;
  --ok:#5fc47a; --oks:#0d2816; --warn:#f5a524; --warns:#2a1d05; --crit:#ff6b70; --crits:#2d0d10;
  --shadow-pop:0 0 0 1px rgba(255,255,255,.1),0 12px 32px -8px rgba(0,0,0,.7); --scrim:rgba(0,0,0,.55);}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0a0a0a; --bg2:#111111; --bg3:#1a1a1a; --fg:#ededed; --fg2:#c9c9c9; --muted:#a1a1a1; --border:#262626; --border2:#3a3a3a;
  --accent:#ededed; --accent-fg:#0a0a0a; --hl:#2b2306; --hl-line:#f5b400; --avbg:#2c2c2c; --dot-fg:#0a0a0a;
  --p1:#52a8ff; --p1s:#0b2140; --p2:#c47ef2; --p2s:#28123d; --p3:#5fc47a; --p3s:#0d2816;
  --ok:#5fc47a; --oks:#0d2816; --warn:#f5a524; --warns:#2a1d05; --crit:#ff6b70; --crits:#2d0d10;
  --shadow-pop:0 0 0 1px rgba(255,255,255,.1),0 12px 32px -8px rgba(0,0,0,.7); --scrim:rgba(0,0,0,.55);}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:calc(var(--hh) + 12px)}
body{background:var(--bg);color:var(--fg);font-family:var(--f-sans);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
h1{font-size:clamp(30px,5vw,48px);line-height:1.04;letter-spacing:-0.045em}
h2{font-size:22px;letter-spacing:-0.03em;line-height:1.2}
h3{font-size:15px;letter-spacing:-0.01em;line-height:1.35}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
:is(a,button,input,summary):focus-visible{outline:2px solid var(--p1);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-family:var(--f-mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:500}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--border)}
.bar{display:flex;align-items:center;gap:12px;padding-block:12px 6px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 260px}
.logo{width:22px;height:22px;flex:none;border-radius:50%;background:conic-gradient(var(--p1),var(--p2),var(--p3),var(--p1))}
.brand b{font-weight:600;font-size:15px;letter-spacing:-0.01em;white-space:nowrap}
.brand span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:var(--r);border:1px solid var(--border);background:var(--bg);color:var(--fg);font-size:13.5px;font-weight:500;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--bg2);border-color:var(--border2)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{opacity:.88}
.btn svg{width:15px;height:15px;flex:none}
.btn.icon{width:32px;padding:0;justify-content:center}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 12px 11px;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;display:flex;gap:6px;align-items:center}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg)}
.tab .n{font-family:var(--f-mono);font-size:11px;background:var(--bg3);color:var(--muted);border-radius:999px;padding:1px 6px}

main{padding-block:28px 80px}
.panel{display:grid;gap:22px;min-width:0}
.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--r2);padding:20px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.linkbtn{border:0;background:none;padding:0;color:var(--muted);font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--fg)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.sec-intro{display:grid;gap:6px;max-width:720px}
.sec-intro p{color:var(--muted)}

.ts{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:12px;line-height:1;padding:4px 7px;border-radius:var(--r);background:var(--bg3);color:var(--fg);text-decoration:none;white-space:nowrap;font-weight:500;border:1px solid transparent;justify-self:start;align-self:start;cursor:pointer;font-variant-numeric:tabular-nums}
.ts::before{content:"";border-left:6px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent}
.ts:hover{border-color:var(--border2);background:var(--bg)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag.c1{background:var(--p1s);color:var(--p1)} .tag.c2{background:var(--p2s);color:var(--p2)} .tag.c3{background:var(--p3s);color:var(--p3)}
.pill{display:inline-block;font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--oks);color:var(--ok)} .pill.warn{background:var(--warns);color:var(--warn)} .pill.crit{background:var(--crits);color:var(--crit)} .pill.mute{background:var(--bg3);color:var(--muted)}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;flex:none;background:var(--avbg);color:var(--fg2);font-size:11px;font-weight:600;overflow:hidden;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--fg) 8%,transparent)}
.av img{width:100%;height:100%;object-fit:cover;object-position:50% 15%;display:block}
.av.lg{width:40px;height:40px;font-size:13px}
.av.sm{width:22px;height:22px;font-size:9.5px}
.stack{display:inline-flex;align-items:center}
.stack .av{margin-right:-7px;box-shadow:0 0 0 2px var(--bg)}
.owner{display:inline-flex;align-items:center;gap:14px;font-size:13px;min-width:0}

details.meta{border:1px solid var(--border);border-radius:var(--r2);background:var(--bg2)}
details.meta > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;font-size:13.5px}
details.meta > summary::-webkit-details-marker{display:none}
details.meta > summary::before{content:"";width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex:none}
details.meta[open] > summary::before{transform:rotate(45deg)}
details.meta > summary b{font-weight:600}
details.meta > summary .muted{flex:1 1 300px;min-width:0}
.meta-body{display:grid;gap:14px;padding:4px 16px 16px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin:0}
.kv div{background:var(--bg);padding:10px 12px}
.kv dt{font-size:12px;color:var(--muted)} .kv dd{margin:2px 0 0;font-weight:500}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.person{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--border);border-radius:var(--r);background:var(--bg);min-width:0}
.person div{min-width:0}
.person b{display:block;font-weight:500;font-size:13.5px}
.person small{display:block;color:var(--muted);font-size:12px;line-height:1.3}

.hero{display:grid;gap:18px;padding:28px;border:1px solid var(--border);border-radius:var(--r2);background-color:var(--bg);background-image:radial-gradient(color-mix(in srgb,var(--fg) 12%,transparent) 1px,transparent 1px);background-size:20px 20px;background-position:-10px -10px}
.hero .accent{font-size:clamp(16px,2vw,19px);color:var(--fg2);max-width:62ch;margin-top:10px;line-height:1.45}
.outs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.out{background:var(--bg);border:1px solid var(--border);border-radius:var(--r2);padding:14px;display:grid;gap:8px;align-content:start}
.out .row{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.out p{font-size:13.5px;color:var(--fg2)}

.rows{display:grid}
.trow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:11px 0;border-top:1px solid var(--border)}
.rows > .trow:first-child{border-top:0;padding-top:0}
.trow .main{display:grid;gap:6px;min-width:0}
.trow .sub{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.check{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--border2);margin-top:2px}
.wrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--border)}
.rows > .wrow:first-child{border-top:0;padding-top:0}
.wrow b{font-weight:500;font-size:13.5px;display:block}
.wrow small{color:var(--muted);font-size:12px;display:block;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow .mins{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}

.tl{display:grid;gap:6px}
.tl-bar{display:flex;gap:2px;height:30px}
.tl-seg{border:0;border-radius:4px;cursor:pointer;font-family:var(--f-mono);font-size:11.5px;font-weight:600;min-width:0;padding:0}
.tl-seg.c1{background:var(--p1s);color:var(--p1)} .tl-seg.c2{background:var(--p2s);color:var(--p2)} .tl-seg.c3{background:var(--p3s);color:var(--p3)}
.tl-seg:hover{box-shadow:inset 0 0 0 1.5px currentColor}
.tl-ticks{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.chrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--border)}
.num{width:24px;height:24px;border-radius:5px;display:inline-grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:600;flex:none}
.num.c1{background:var(--p1s);color:var(--p1)} .num.c2{background:var(--p2s);color:var(--p2)} .num.c3{background:var(--p3s);color:var(--p3)}
.chrow b{font-weight:500}
.chrow small{display:block;color:var(--muted);font-size:12.5px}
.chrow .acts{display:flex;gap:6px;align-items:center}
.notes{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.notes li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:10px 0;border-top:1px solid var(--border);font-size:13.5px}

.tx{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;align-items:start}
.tx-nav{position:sticky;top:calc(var(--hh) + 16px);display:grid;gap:12px;max-height:calc(100vh - var(--hh) - 32px);overflow:auto}
.search{width:100%;height:34px;border:1px solid var(--border);border-radius:var(--r);background:var(--bg);color:var(--fg);padding:0 10px;font:inherit;font-size:13.5px}
.tx-nav nav{display:grid;gap:2px}
.tx-nav nav button{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start;text-align:left;border:0;background:none;padding:7px 8px;border-radius:var(--r);cursor:pointer;font-size:13px;line-height:1.35;color:var(--fg2)}
.tx-nav nav button:hover{background:var(--bg2);color:var(--fg)}
.tx-nav nav button small{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.tx-acts{display:flex;gap:8px;flex-wrap:wrap}
.tx-acts .btn{flex:1 1 auto;justify-content:center}
.cleanstat{font-size:12.5px;color:var(--muted);border:1px dashed var(--border2);border-radius:var(--r);padding:8px 10px;line-height:1.45}
.chap{display:grid;gap:4px;margin-bottom:36px}
.chap-h{display:grid;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--border);margin-bottom:6px}
.chap-h .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chap-h h2{font-size:20px}
.chap-h ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.chap-h li{font-size:12.5px;color:var(--fg2);background:var(--bg2);border:1px solid var(--border);border-radius:999px;padding:3px 10px}
.u{display:grid;grid-template-columns:62px 28px minmax(0,1fr);gap:10px;padding:10px 8px;border-radius:var(--r);transition:background .2s,opacity .2s}
.u .who{font-weight:600;font-size:13px}
.u p{color:var(--fg2);margin-top:1px}
.u.hl{background:var(--hl);box-shadow:inset 3px 0 0 var(--hl-line)}
.u mark{background:var(--hl);color:inherit;border-radius:2px;box-shadow:0 0 0 1px var(--hl-line)}

.cmap{display:grid;justify-items:center}
.cm-root{background:var(--accent);color:var(--accent-fg);padding:10px 18px;border-radius:var(--r2);text-align:center;font-weight:600;font-size:16px;letter-spacing:-0.01em}
.cm-root small{display:block;font-weight:400;font-size:12.5px;opacity:.75;letter-spacing:0}
.cm-stem{width:1px;height:20px;background:var(--border2)}
.cm-grid{position:relative;width:100%;display:grid;padding-top:20px}
.cm-grid.one::before{display:none}
#projBody{--pc:var(--p1);--pcs:var(--p1s)}
.cm-grid::before{content:"";position:absolute;top:0;height:1px;background:var(--border2);left:var(--rail);right:var(--rail)}
.cm-b{position:relative;display:grid;gap:10px;align-content:start;background:var(--bg);border:1px solid var(--border);border-radius:var(--r2);padding:16px;text-align:left;cursor:pointer}
.cm-b:hover{border-color:var(--border2)}
.cm-b::before{content:"";position:absolute;top:-21px;left:50%;width:1px;height:20px;background:var(--border2)}
.cm-b .t{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cm-b .t h3{font-size:17px;letter-spacing:-0.02em}
.cm-b > p{font-size:13px;color:var(--muted)}
.cm-b ul{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.cm-b li{font-size:13px;padding:6px 9px;border-radius:var(--r);background:var(--bg2);border:1px solid var(--border)}
.cm-b li.open{background:var(--warns);border-color:transparent;color:var(--warn);font-weight:500}
.cm-b .go{font-size:12.5px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.cm-b.c1{border-top:2px solid var(--p1)} .cm-b.c2{border-top:2px solid var(--p2)} .cm-b.c3{border-top:2px solid var(--p3)}
.cm-l{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;font-size:11.5px;color:var(--muted);padding:0 4px}
.cm-l i{width:100%;height:1px;background:var(--muted);position:relative}
.cm-l i::after{content:"";position:absolute;right:-1px;top:-4px;border-left:7px solid var(--muted);border-top:4.5px solid transparent;border-bottom:4.5px solid transparent}
.seg{display:inline-flex;gap:2px;padding:3px;background:var(--bg2);border:1px solid var(--border);border-radius:calc(var(--r) + 3px);flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:var(--r);font-size:13.5px;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--fg);box-shadow:0 0 0 1px var(--border),0 1px 2px rgba(0,0,0,.05)}
.seg button i{width:7px;height:7px;border-radius:50%}
.pintro{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px}
.pintro .what{font-size:16px;line-height:1.55;color:var(--fg2)}
.pfacts{display:grid;gap:10px;font-size:13.5px;align-content:start}
.pfacts > div{display:grid;gap:2px}
.counts3{display:flex;gap:8px;flex-wrap:wrap}
.counts3 button{border:1px solid var(--border);background:var(--bg2);border-radius:var(--r);padding:6px 10px;font-size:13px;cursor:pointer;color:var(--fg2)}
.counts3 button b{font-family:var(--f-mono);color:var(--fg)}

.jstep{display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px}
.jrail{display:flex;flex-direction:column;align-items:center}
.jrail .dot{width:30px;height:30px;border-radius:50%;background:var(--pc);color:var(--dot-fg);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:600;flex:none}
.jrail .line{width:2px;flex:1;background:var(--pcs);margin:4px 0}
.jstep:last-child .jrail .line{display:none}
.jbody{padding-bottom:22px;display:grid;gap:10px;min-width:0}
.jbody .head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:4px}
.jbody .head h3{font-size:17px;letter-spacing:-0.02em}
.jbody .buyer{color:var(--muted);font-size:13.5px}
.jcols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr);gap:8px}
.jcols > div{border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;display:grid;gap:4px;align-content:start;font-size:13.5px}
.jcols .does{background:var(--pcs);border-color:transparent}
.jcols .label{font-size:10.5px}
.sockets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sock{border:1.5px dashed color-mix(in srgb,var(--pc) 50%,transparent);border-radius:var(--r2);padding:14px;display:grid;gap:6px;align-content:start;font-size:13.5px}
.sock svg{width:20px;height:20px;color:var(--pc)}
.sock b{font-weight:600}
.sock span{color:var(--fg2)}
.quote{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px;padding:10px 12px;border-radius:var(--r);background:var(--bg2);border:1px solid var(--border);font-size:13.5px}
.quote q{font-style:italic;color:var(--fg2)}

function txMd(){
  const L=[`# ${M.title} - transcript`,'',`**Date:** ${M.date}${M.start?', '+M.start:''} · **Duration:** ${durL} · **Where:** ${M.platform||'Teams'}${M.place?', '+M.place:''}`,'',`**People:** ${D.people.map(p=>p.name+(p.title?` (${p.title})`:'')+(p.attended?'':', mentioned')).join('; ')}`];
  if(M.agenda)L.push('',`**Agenda:** ${M.agenda}`);
  if(M.recording)L.push('',`**Recording:** ${M.recording}`);
  L.push('',`*Clean transcript: ${C.lines_before} caption lines became ${C.lines_after} turns. Filler removed, ${C.fixes} spelling fixes applied. The original stays in ${M.platform||'Teams'}.*`);
  CH.forEach(c=>{L.push('',`## ${c.n}. ${c.title} (${fmt(c.start)} - ${fmt(c.end)})`,'',`*Project: ${PJ[c.project]?PJ[c.project].name:c.project}*`);
    if(c.note)L.push('',c.note);
    if(c.see&&c.see.length)L.push('',...c.see.map(s=>'- '+s));
    U.filter(u=>u.s>=c.start&&u.s<c.end).forEach(u=>L.push('',`**[${fmt(u.s)}] ${P[u.sp]?P[u.sp].name:u.sp}:** ${u.text}`))});
  return L.join('\n')+'\n';
}

<div class="openq">${D.open.map(o=>`<div class="oq"><div class="top"><span class="tag ${pc(o.project)}">${esc(PJ[o.project].name)}</span><span class="need">${NEED[o.kind]}</span></div><h3>${esc(o.q)}</h3>
  <dl><div><dt>Why it's open</dt><dd>${esc(o.why)}</dd></div><div><dt>What settles it</dt><dd>${esc(o.close)}</dd></div><div><dt>Next step</dt><dd>${esc(o.next)}</dd></div></dl>
  <div class="foot">${o.who.length?`<span class="owner"><span class="stack">${o.who.map(w=>av(w,'sm')).join('')}</span><span>${o.who.map(first).join(', ')}</span></span>`:'<span class="pill warn">Needs owner</span>'}${ts(o.t)}</div></div>`).join('')}</div>`;

/* TASKS */
const FIL=[['all','All'],['now','Do now'],...D.projects.map(p=>[p.id,p.name]),['ext','External']];
$('#p-tasks').innerHTML=`<div class="card-h" style="margin:0"><div><div class="label">To-dos</div><h2>${D.tasks.length} tasks · ${D.tasks.filter(t=>!t.external).length} our team · ${D.tasks.filter(t=>t.external).length} external</h2></div><button class="btn primary" type="button" data-excel="1">${DL}Download Excel</button></div>
<div class="filters" role="group" aria-label="Filter tasks">${FIL.map(([k,l],i)=>`<button class="fbtn" type="button" data-f="${k}" aria-pressed="${i===0}">${l}</button>`).join('')}</div>
<div class="tbl"><table><thead><tr><th>ID</th><th>Task</th><th>Owner</th><th>Project</th><th>Priority</th><th>Due</th><th>Status</th><th>At</th></tr></thead><tbody>${D.tasks.map(t=>`<tr data-p="${t.project}" data-pr="${t.priority}" data-x="${t.external?1:0}"><td class="id">${t.id}</td><td style="min-width:260px">${esc(t.task)}</td><td>${owners(t)}</td><td><span class="tag ${pc(t.project)}">${esc(PJ[t.project].name)}</span></td><td>${t.priority==='now'?'<span class="pill crit">Do now</span>':t.priority==='next'?'<span class="pill mute">Next</span>':'<span class="pill mute">Proposed</span>'}</td><td class="mono" style="font-size:12.5px;white-space:nowrap">${esc(t.due)}</td><td>${t.external?'<span class="pill warn">External</span>':`<span class="pill ${ST[t.status]||'mute'}">${esc(t.status)}</span>`}</td><td>${ts(t.t)}</td></tr>`).join('')}</tbody></table></div>
<p class="muted" style="font-size:13px">${esc(D.taskNote||"")} TBC means no date was said in the meeting.</p>`;
$$('.fbtn').forEach(b=>b.addEventListener('click',()=>{$$('.fbtn').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));const f=b.dataset.f;$$('#p-tasks tbody tr').forEach(r=>{r.hidden=!(f==='all'||(f==='now'&&r.dataset.pr==='now')||(f==='ext'&&r.dataset.x==='1')||r.dataset.p===f)})}));

/* WATCH */
$('#p-watch').innerHTML=`<div class="sec-intro"><div class="label">Watch list</div><h2>Missed the call? Watch only your parts</h2><p>About ${avgMin} minutes each instead of ${totMin}. Hover a time to read what was said, or press Read to see that part of the transcript highlighted.${onCall.length?` ${esc(onCall.join(" and "))} ${onCall.length>1?"were":"was"} on the call.`:""}</p></div>
<div class="watch">${W.map(w=>{const p=P[w.person];return `<div class="card wc"><div class="wt"><div>${av(w.person,'lg')}<div style="min-width:0"><b>${esc(p.name)}</b><small>${esc(p.title)}</small></div></div><span class="big">${Math.max(1,Math.round(w.sec/60))} <small>min</small></span></div>
  <div class="mini" aria-hidden="true">${w.ranges.map(r=>`<span style="left:${r[0]/DUR*100}%;width:${(r[1]-r[0])/DUR*100}%"></span>`).join('')}</div>
  <div class="parts">${w.ranges.map(r=>`<div class="part">${ts(r[0],r[1])}<span>${esc(r[2])}</span><button class="read" type="button" data-read="${r[0]}" data-reade="${r[1]}">Read</button></div>`).join('')}</div></div>`}).join('')}</div>`;

/* REVIEW */
$('#p-review').innerHTML=`<div class="sec-intro"><div class="label">Step 1 · spelling check</div><h2>Words the captions got wrong</h2><p>Sure fixes are already applied to the clean transcript. Confirm the ${D.spelling.filter(s=>!s.sure).length} guesses marked in amber. Your answers are remembered for the next meeting.</p></div>
<div class="tbl"><table><thead><tr><th>Heard as</th><th>Fix</th><th>Meaning</th><th>In the meeting</th><th>At</th><th></th></tr></thead><tbody>${D.spelling.map(s=>{const f=s.heard.split(' / ')[0].split(',')[0];const re=new RegExp(reEsc(f),'i');return `<tr><td class="heard">${esc(s.heard)}</td><td class="fix">${s.sure?esc(s.fix):`<span class="pill warn">${esc(s.fix)}</span>`}</td><td>${esc(s.meaning)}</td><td><q>${esc(s.example).replace(re,m=>`<mark>${m}</mark>`)}</q></td><td>${ts(s.t)}</td><td><button type="button" class="acc" aria-pressed="false" data-l="${s.sure?'Accept':'Confirm'}">${s.sure?'Accept':'Confirm'}</button></td></tr>`}).join('')}</tbody></table></div>
<div class="card" style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><div><div class="label">Step 2 · clean transcript</div><p style="margin-top:4px">${C.lines_before} caption lines became ${C.lines_after} readable turns, with ${C.fixes} fixes applied.</p></div><button class="btn" type="button" data-go="transcript">Open transcript</button></div>`;
$$('.acc').forEach(b=>b.addEventListener('click',()=>{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',String(on));b.textContent=on?'Done':b.dataset.l}));

/* CHECK (quiz) */
const QZ=D.quiz,QS=QZ.questions,LET='ABCD';
let picks={},saved=null;const cap={db:null,user:null,me:null,canEdit:false};
function reviewBtns(qi){const r=QS[qi].review;return `<div class="acts"><button class="btn" type="button" data-rev="${qi}">Review: ${esc(r.label)}</button><button class="btn" type="button" data-read="${r.t}"${r.e!=null?` data-reade="${r.e}"`:''}>Read ${fmt(r.t)} in the transcript</button></div>`}
function savedLine(){if(!saved)return '';const d=new Date(saved.at).toLocaleDateString(undefined,{day:'numeric',month:'short'});return `<span class="${saved.passed?'done-ic':''}">${saved.passed?'✓ Passed':'Not passed yet'}</span> · your last result ${saved.score} of ${saved.total}, ${d}`}
function renderCheck(){
  const n=Object.keys(picks).length,right=QS.filter(q=>picks[q.id]===q.answer).length,done=n===QS.length,pass=right>=QZ.pass,missed=QS.map((q,i)=>[q,i]).filter(([q])=>picks[q.id]!==q.answer);
  $('#p-check').innerHTML=`<div class="qwrap">
  <div class="sec-intro"><div class="label">Check your understanding</div><h2>${QS.length} questions about this meeting</h2><p>Pick an answer to see if it's right. Get ${QZ.pass} of ${QS.length} to pass. A wrong answer shows you the tab and the part of the meeting to review.</p></div>
  <div class="qhead"><div class="qprog"><span>${n} of ${QS.length} answered</span><div class="m"><span style="width:${n/QS.length*100}%"></span></div></div><span class="qsave">${savedLine()}</span></div>
  ${QS.map((q,qi)=>{const p=picks[q.id],ans=p!=null,ok=p===q.answer;return `<div class="qcard ${ans?(ok?'ok':'no'):''}" id="q-${q.id}"><h3><span class="mono">${qi+1}</span><span>${esc(q.q)}</span></h3>
    <div class="opts" role="group" aria-label="Answers to question ${qi+1}">${q.options.map((o,oi)=>{let cls='';if(ans){cls=oi===q.answer?'right':oi===p?'wrong':'dim'}const mark=ans&&oi===q.answer?'✓':ans&&oi===p?'✕':LET[oi];return `<button type="button" class="opt ${cls}" data-q="${q.id}" data-o="${oi}"${ans?' disabled':''}><i>${mark}</i><span>${esc(o)}</span></button>`}).join('')}</div>
    ${ans?(ok?`<div class="fb ok"><b>Correct.</b><span>${esc(q.why)}</span></div>`:`<div class="fb no"><b>Not quite.</b><span>${esc(q.why)}</span>${reviewBtns(qi)}</div>`):''}</div>`}).join('')}
  ${done?`<div class="qres" id="qres"><div class="score">${right} <small>of ${QS.length} right</small></div>
    ${pass?`<p><b class="done-ic">You're up to speed.</b> ${missed.length?'Have a quick look at the one you missed.':'Nothing to review.'}</p>`:`<p><b style="color:var(--crit)">Not yet.</b> Review these parts, then try the missed questions again.</p>`}
    ${missed.length?`<ul>${missed.map(([q,qi])=>`<li><span>${esc(q.q)}</span><span class="actions"><button class="btn" type="button" data-rev="${qi}">${esc(q.review.label)}</button>${ts(q.review.t,q.review.e)}</span></li>`).join('')}</ul>`:''}
    <div class="actions">${missed.length?'<button class="btn primary" type="button" id="qRetry">Try the missed ones again</button>':''}<button class="btn" type="button" id="qReset">Start over</button></div>
    <p class="qsave" id="qSaved">${cap.db&&cap.me?'Saving your result…':'Your result shows here only. It is saved for the board owner when the board is opened in Claude with Contributor access.'}</p></div>`:''}
  <div id="qAdmin"></div></div>`;
  renderAdmin();
}
async function finish(){
  if(!(cap.db&&cap.me))return;
  const right=QS.filter(q=>picks[q.id]===q.answer).length,passed=right>=QZ.pass;
  const body={score:right,total:QS.length,passed,wrong:QS.filter(q=>picks[q.id]!==q.answer).map(q=>q.id),at:new Date().toISOString(),attempts:((saved&&saved.attempts)||0)+1};
  try{await cap.db.doc('quiz/'+cap.me).set(body);saved=body;const el=$('#qSaved');if(el)el.textContent='Result saved. The board owner can see it.';setOv()}
  catch(e){const el=$('#qSaved');if(el)el.textContent='Your result could not be saved (view-only access). Your answers still show here.'}
}
function setOv(){const o=$('#ovCheck');if(o&&saved)o.textContent=saved.passed?'You passed ✓. You can take it again any time.':'Not passed yet. Review the missed parts and try again.'}
document.addEventListener('click',e=>{
  const o=e.target.closest('.opt[data-q]');
  if(o&&!o.disabled){picks[o.dataset.q]=+o.dataset.o;const all=Object.keys(picks).length===QS.length;renderCheck();
    if(all){finish();const r=$('#qres');if(r)r.scrollIntoView({block:'center',behavior:'smooth'})}
    else{const c=document.getElementById('q-'+o.dataset.q);if(c)c.scrollIntoView({block:'nearest',behavior:'smooth'})}return}
  const rv=e.target.closest('[data-rev]');
  if(rv){const r=QS[+rv.dataset.rev].review;go(r.tab,()=>{if(r.proj){setProj(r.proj);$('#projSwitch').scrollIntoView({block:'start'})}});return}
  if(e.target.closest('#qRetry')){QS.forEach(q=>{if(picks[q.id]!==q.answer)delete picks[q.id]});renderCheck();const f=QS.find(q=>picks[q.id]==null);if(f)document.getElementById('q-'+f.id).scrollIntoView({block:'center'});return}
  if(e.target.closest('#qReset')){picks={};renderCheck();window.scrollTo(0,0)}
});
let adminRows=null,adminNote='';
async function renderAdmin(){
  const box=$('#qAdmin');if(!box||!cap.canEdit||!cap.db)return;
  const head=t=>`<div class="card-h"><div><div class="label">Only you and editors see this</div><h2>${t}</h2></div></div>`;
  if(adminRows===null){box.innerHTML=`<div class="card">${head('Who has checked')}<p class="muted">${adminNote||'Loading results…'}</p></div>`;return}
  if(!adminRows.length){box.innerHTML=`<div class="card">${head('Who has checked')}<p class="muted">Nobody has taken the check yet. Share the board with Contributor access so each person's result is saved.</p></div>`;return}
  let ps={};try{ps=cap.user?await cap.user.profiles(adminRows.map(r=>r.id)):{}}catch(e){ps={}}
  const passed=adminRows.filter(r=>r.d.passed).length;
  box.innerHTML=`<div class="card">${head(`Who has checked · ${passed} of ${adminRows.length} passed`)}
  <div class="tbl"><table style="min-width:560px"><thead><tr><th>Person</th><th>Result</th><th>Score</th><th>Missed</th><th>Tries</th><th>When</th></tr></thead><tbody>${adminRows.map(r=>{const p=ps[r.id]||{};return `<tr><td><span class="owner" style="gap:8px">${p.avatarUrl?`<span class="av sm"><img src="${esc(p.avatarUrl)}" alt=""></span>`:''}<span class="nm"></span></span></td><td><span class="pill ${r.d.passed?'ok':'warn'}">${r.d.passed?'Passed':'Review needed'}</span></td><td class="mono">${r.d.score}/${r.d.total}</td><td>${(r.d.wrong||[]).map(w=>{const qi=QS.findIndex(q=>q.id===w);return qi>-1?`<span class="pill mute" title="${esc(QS[qi].q)}">Q${qi+1}</span>`:''}).join(' ')||'None'}</td><td class="mono">${r.d.attempts||1}</td><td class="mono" style="font-size:12.5px">${new Date(r.d.at).toLocaleString(undefined,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</td></tr>`}).join('')}</tbody></table></div></div>`;
  box.querySelectorAll('.nm').forEach((el,i)=>{const p=ps[adminRows[i].id]||{};el.textContent=p.name||'Someone'});
}
renderCheck();
(async()=>{
  if(!(window.claude&&typeof window.claude.use==='function'))return;
  let db=null,user=null;try{[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')])}catch(e){}
  cap.db=db;cap.user=user;
  if(user){try{cap.me=await user.id();cap.canEdit=await user.canEdit()}catch(e){}}
  if(db&&cap.me){try{const s=await db.doc('quiz/'+cap.me).get();if(s.exists){saved=s.data();setOv()}}catch(e){}}
  if(db&&cap.canEdit){
    const timer=setTimeout(()=>{if(adminRows===null){adminNote='Results can\'t be reached right now.';renderAdmin()}},10000);
    db.collection('quiz').onSnapshot(snap=>{if(!snap.metadata.fromCache)clearTimeout(timer);adminRows=snap.docs.filter(d=>d.exists).map(d=>({id:d.id,d:d.data()}));renderAdmin()},()=>{clearTimeout(timer);adminRows=null;adminNote='Results can\'t be loaded.';renderAdmin()});
  }
  renderCheck();
})();

/* timestamps with no recording link open the transcript panel */
document.addEventListener('click',e=>{const a=e.target.closest('.ts');if(a&&!a.getAttribute('href')&&!a.closest('#pop')&&matchMedia('(hover:hover) and (pointer:fine)').matches)openDrawer(+a.dataset.t,a.dataset.e?+a.dataset.e:null)});
document.addEventListener('keydown',e=>{const a=e.target.closest&&e.target.closest('.ts[role=button]');if(a&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openDrawer(+a.dataset.t,a.dataset.e?+a.dataset.e:null)}});
/* shared clicks */
document.addEventListener('click',e=>{
  if(e.target.closest('[data-excel]')){excel();return}
  const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
  const c=e.target.closest('[data-ch]');if(c){const n=c.dataset.ch;go('transcript',()=>{const el=document.getElementById('ch-'+n);if(el)el.scrollIntoView({block:'start'})});return}
  const r=e.target.closest('[data-read]');if(r){openDrawer(+r.dataset.read,r.dataset.reade?+r.dataset.reade:null);return}
});

/* transcript lookup, hover preview, side panel */
function idxAt(t){let k=0;for(let i=0;i<U.length;i++){if(U[i].s<=t)k=i;else break}return k}
function partIdx(t,e){if(e==null)return [idxAt(t)];const a=idxAt(t),out=[];for(let i=a;i<U.length&&U[i].s<e;i++)out.push(i);return out.length?out:[a]}
const pop=$('#pop');let hideT,showT,popFor=null;
function openPop(a){
  const t=+a.dataset.t,e=a.dataset.e?+a.dataset.e:null,u=U[idxAt(t)];popFor=a;
  pop.innerHTML=`<div class="ph">${av(u.sp,'sm')}<b>${esc(first(u.sp))}</b><span class="mono">${fmt(u.s)}${e!=null?' · part runs to '+fmt(e):''}</span></div><p>${esc(u.text)}</p><div class="pa"><button class="btn" type="button" id="popRead">Read full part</button>${M.recording?`<a class="btn primary" href="${at(t)}" target="_blank" rel="noopener">${PLAY}Play ${fmt(t)}</a>`:""}</div>`;
  pop.hidden=false;const r=a.getBoundingClientRect(),pw=pop.offsetWidth,ph=pop.offsetHeight;
  let x=Math.min(Math.max(12,r.left),innerWidth-pw-12),y=r.bottom+8;if(y+ph>innerHeight-12)y=Math.max(12,r.top-ph-8);
  pop.style.left=x+'px';pop.style.top=y+'px';
  $('#popRead').addEventListener('click',()=>{closePop();openDrawer(t,e)});
}
function closePop(){pop.hidden=true;popFor=null}
const fine=matchMedia('(hover:hover) and (pointer:fine)');
document.addEventListener('mouseover',e=>{if(!fine.matches)return;const a=e.target.closest('.ts');if(a&&!a.closest('#pop')){clearTimeout(hideT);if(popFor!==a){clearTimeout(showT);showT=setTimeout(()=>openPop(a),260)}}else if(e.target.closest('#pop'))clearTimeout(hideT)});
document.addEventListener('mouseout',e=>{if(!fine.matches)return;if(e.target.closest('.ts')||e.target.closest('#pop')){clearTimeout(showT);hideT=setTimeout(closePop,240)}});
document.addEventListener('click',e=>{const a=e.target.closest('.ts');if(e.target.closest('#pop'))return;if(a&&!fine.matches){e.preventDefault();if(popFor===a)closePop();else openPop(a)}else if(!a)closePop()},true);
document.addEventListener('focusin',e=>{const a=e.target.closest('.ts');if(a&&fine.matches&&!a.closest('#pop'))openPop(a)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePop();closeDrawer()}});
addEventListener('scroll',()=>{if(!pop.hidden)closePop()},{passive:true});

const dr=$('#drawer'),scrim=$('#scrim');
function openDrawer(t,e){
  closePop();
  const ids=partIdx(t,e),c=chOf(U[ids[0]].s);
  const lo=Math.max(0,ids[0]-2),hi=Math.min(U.length-1,ids[ids.length-1]+2);
  let rows='';for(let i=lo;i<=hi;i++)rows+=uRow(U[i],i,ids.includes(i)?' hl':'');
  dr.innerHTML=`<div class="dh"><div><b>${e!=null?'Part '+fmt(t)+' – '+fmt(e):'At '+fmt(t)}</b><small>Chapter ${c.n} · ${esc(c.title)} · only the highlighted lines belong to this part</small></div><button class="btn icon" type="button" id="drClose" aria-label="Close">✕</button></div>
  <div class="db">${rows}</div>
  <div class="df">${M.recording?`<a class="btn primary" href="${at(t)}" target="_blank" rel="noopener">${PLAY}Play from ${fmt(t)}</a>`:"<span></span>"}<button class="btn" type="button" id="drFull">Open in transcript</button></div>`;
  dr.hidden=false;scrim.hidden=false;
  const h=dr.querySelector('.u.hl');if(h)h.scrollIntoView({block:'center'});
  $('#drClose').addEventListener('click',closeDrawer);$('#drClose').focus();
  $('#drFull').addEventListener('click',()=>{closeDrawer();go('transcript',()=>{$$('#txbody .u.hl').forEach(x=>x.classList.remove('hl'));ids.forEach(i=>{const el=document.getElementById('u-'+i);if(el)el.classList.add('hl')});const el=document.getElementById('u-'+ids[0]);if(el)el.scrollIntoView({block:'center'})})});
}
function closeDrawer(){dr.hidden=true;scrim.hidden=true}
scrim.addEventListener('click',closeDrawer);

show(location.hash.slice(1)||'overview',true);
})();
</script>
